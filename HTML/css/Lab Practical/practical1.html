<!DOCTYPE html>
<html>
<head>
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f4f4;
        }
        table {
            margin: 40px auto;
            border-collapse: collapse;
            width: 350px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        td {
            padding: 10px;
        }
        h2 {
            text-align: center;
        }
        img {
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
            <td colspan="2" align="center">
                <img src="profile.jpg" alt="Profile Picture" width="120" height="120">
            </td>
        </tr>
        <tr>
            <td><b>Name</b></td>
            <td>Harshit Pandey</td>
        </tr>
        <tr>
            <td><b>Role</b></td>
            <td>Student (Computer Science)</td>
        </tr>
        <tr>
            <td><b>Email</b></td>
            <td><a href="mailto:pharshit845@gmail.com">pharshit845@gmail.com</a></td>
        </tr>
        <tr>
            <td><b>Phone</b></td>
            <td>+91-8931800424</td>
        </tr>
        <tr>
            <td><b>About</b></td>
            <td>Enthusiastic student ready to learn something new, passionate about coding and learning.</td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <a href="#">GitHub</a> | <a href="#">LinkedIn</a>
            </td>
        </tr>
    </table>
</body>
</html>
